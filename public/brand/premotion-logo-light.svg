<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" fill="none">
  <!-- Light background variant -->
  <rect width="420" height="100" fill="#F8F8F9"/>

  <!-- Top edge -->
  <line x1="29" y1="30" x2="83" y2="30" stroke="rgba(8,8,10,0.82)" stroke-width="1.5" stroke-linecap="square"/>
  <!-- Bottom edge -->
  <line x1="29" y1="70" x2="83" y2="70" stroke="rgba(8,8,10,0.82)" stroke-width="1.5" stroke-linecap="square"/>
  <!-- Left edge -->
  <line x1="20" y1="39" x2="20" y2="61" stroke="rgba(8,8,10,0.82)" stroke-width="1.5" stroke-linecap="square"/>
  <!-- Right edge -->
  <line x1="92" y1="39" x2="92" y2="61" stroke="rgba(8,8,10,0.82)" stroke-width="1.5" stroke-linecap="square"/>

  <!-- Cyan standby dot -->
  <circle cx="20" cy="30" r="2.5" fill="#0891B2" opacity="0.9"/>

  <!-- PREMOTION wordmark — dark on light -->
  <text
    x="114"
    y="66"
    font-family="'Helvetica Neue', Helvetica, 'Arial Narrow', Arial, sans-serif"
    font-weight="800"
    font-size="34"
    letter-spacing="-1.2"
    fill="rgba(8,8,10,0.87)"
  >PREMOTION</text>
</svg>
