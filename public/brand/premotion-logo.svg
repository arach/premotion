<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" fill="none">
  <!-- Background -->
  <rect width="420" height="100" fill="#08080A"/>

  <!--
    Open-corner frame — 72×40.5 (16:9)
    Centered at (20,29.75)→(92,70.25), gap=9px at each corner
    The open corners signal: not yet closed, still in motion, pre-shot
  -->

  <!-- Top edge -->
  <line x1="29" y1="30" x2="83" y2="30" stroke="rgba(255,255,255,0.88)" stroke-width="1.5" stroke-linecap="square"/>
  <!-- Bottom edge -->
  <line x1="29" y1="70" x2="83" y2="70" stroke="rgba(255,255,255,0.88)" stroke-width="1.5" stroke-linecap="square"/>
  <!-- Left edge -->
  <line x1="20" y1="39" x2="20" y2="61" stroke="rgba(255,255,255,0.88)" stroke-width="1.5" stroke-linecap="square"/>
  <!-- Right edge -->
  <line x1="92" y1="39" x2="92" y2="61" stroke="rgba(255,255,255,0.88)" stroke-width="1.5" stroke-linecap="square"/>

  <!-- Cyan standby dot — top-left corner, like a camera's ready signal -->
  <circle cx="20" cy="30" r="2.5" fill="#22D3EE" opacity="0.9"/>

  <!-- PREMOTION wordmark -->
  <text
    x="114"
    y="66"
    font-family="'Helvetica Neue', Helvetica, 'Arial Narrow', Arial, sans-serif"
    font-weight="800"
    font-size="34"
    letter-spacing="-1.2"
    fill="rgba(255,255,255,0.93)"
  >PREMOTION</text>
</svg>
